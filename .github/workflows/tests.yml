name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  tests:

    name: PHP ${{ matrix.php }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, dom, fileinfo, intl, gd, json, mbstring, pdo, pdo_sqlite, openssl, sqlite, xml, zip
          coverage: none

      - name: Copy .env
        run: cp .env.testing .env

      - name: Install NPM
        run: npm install

      - name: Compile assets
        run: npm run production

      - name: Install Composer
        run: composer test

      - name: Execute tests
        run: php artisan test --parallel

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-artifacts-php-${{ matrix.php }}
          path: |
            storage/logs/
            storage/framework/testing/views/
          retention-days: 7

  soak:

    name: Soak tests (PHP 8.3)

    runs-on: ubuntu-latest

    # Only run on manual dispatch or the nightly schedule -- not on every push/PR,
    # since this repeats the suite many times and is meant for flake-hunting, not
    # per-commit feedback.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: php-8.3-composer-${{ hashFiles('composer.json') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, dom, fileinfo, intl, gd, json, mbstring, pdo, pdo_sqlite, openssl, sqlite, xml, zip
          coverage: none

      - name: Copy .env
        run: cp .env.testing .env

      - name: Install NPM
        run: npm install

      - name: Compile assets
        run: npm run production

      - name: Install Composer
        run: composer test

      - name: Run soak tests
        # N=20 is a CI-budget-friendly default for the scheduled/dispatched job;
        # the issue's plan suggests N=100 for local/manual flake-hunting -- not set in stone.
        run: bash tools/ci/soak-tests.sh 20
