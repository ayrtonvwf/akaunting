services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: akaunting_local
      MYSQL_USER: akaunting
      MYSQL_PASSWORD: akaunting_local
      MYSQL_ROOT_PASSWORD: root_local_only
    volumes:
      - akaunting_local_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local_only"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  akaunting_local_db:
